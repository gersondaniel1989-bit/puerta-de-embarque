n esperar. (Los pasajeros se mueven con sus maletas) Ah...El equipaje no está permitido en el viaje."}, {"t": "d", "k": "P2", "v": false, "x": "¿Lo mandan directo al destino?"}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "No. El equipaje es inútil en su destino. Por favor, deshacerse de él en el basurero del fondo."}, {"t": "a", "x": "La aeromoza se va. Los cuatro pasajeros miran sus boletos. Luego se miran entre ellos. Y luego al basurero."}, {"t": "f", "x": "FIN DE ESCENA 1"}]}, {"n": 2, "name": "Preparados para el viaje", "items": [{"t": "a", "x": "La escena continúa inmediatamente después de que la aeromoza les indica que deben deshacerse de su equipaje. Los cuatro pasajeros permanecen frente al basurero. Cada uno mira su boleto y luego el lugar donde dejó sus pertenencias. Hay un silencio incómodo."}, {"t": "d", "k": "P2", "v": false, "x": "¿Entonces... tenemos que tirar las maletas?"}, {"t": "d", "k": "P3", "v": false, "x": "Eso fue lo que dijo."}, {"t": "d", "k": "P2", "v": false, "x": "Sí, sí, pero… ¿todas? ¿No hay una opción?"}, {"t": "d", "k": "P4", "v": false, "x": "¿Qué opción?"}, {"t": "d", "k": "P2", "v": false, "x": "No sé, pagar extra. O mandarlas después. Algo"}, {"t": "d", "k": "P1", "v": false, "x": "No creo que sea opcional. Quizás no son necesarias"}, {"t": "d", "k": "P3", "v": false, "x": "¿Cómo que no son necesarias?"}, {"t": "d", "k": "P4", "v": false, "x": "¡En mi equipaje hay cosas importantes!"}, {"t": "d", "k": "P1", "v": false, "x": "Y en el mío también…. De hecho, pensé que debía usar el mío específicamente para este viaje. Está todo lo que soy en esa maleta. (La mira)"}, {"t": "d", "k": "P2", "v": false, "x": "Todo lo que necesito está en esa maleta. (Se acerca a mirar también)"}, {"t": "d", "k": "P3", "v": false, "x": "Todo mi tiempo. (Se acerca a mirar también)"}, {"t": "d", "k": "P4", "v": false, "x": "Todo mi sacrificio. (Se acerca a mirar también)"}, {"t": "a", "x": "Se hace un silencio prolongado antes de que entre un vendedor de papas, y los cuatro pasajeros que veían su maleta pegan un brinco del susto que se llevan."}, {"t": "d", "k": "VENDEDOR", "v": false, "x": "¡PAPAAAAAAAS! ¡LLEVE SUS PAPAAAAS! ¡Papas para el viaje! ¡Papas para el camino! Para no morir de hambre. ¡Si van a viajar, tienen que estar PRE-PA-RA-DOS!"}, {"t": "d", "k": "P2", "v": false, "x": "¿Qué? ¿Papas?"}, {"t": "d", "k": "VENDEDOR", "v": false, "x": "Papas."}, {"t": "d", "k": "P2", "v": false, "x": "¿Solo papas tienen? ¿No tendrá una milanesa por ahí?"}, {"t": "d", "k": "VENDEDOR", "v": false, "x": "Papas. Amigo, solo papas. ¿Para dónde se dirigen, compañeros? ¿Van para Eternidad? (Los cuatro se miran.)"}, {"t": "d", "k": "P1", "v": false, "x": "Sí..."}, {"t": "d", "k": "VENDEDOR", "v": false, "x": "Ahhh… (mira a las papas) Entonces creo que estas no les van a servir de mucho."}, {"t": "d", "k": "P2", "v": false, "x": "¡Bueno, eso fue raro!"}, {"t": "d", "k": "P1", "v": false, "x": "Tal vez hay cosas que sirven para el viaje de todos los días... pero no para este viaje."}, {"t": "d", "k": "P4", "v": false, "x": "Pero yo no entiendo."}, {"t": "d", "k": "P1", "v": false, "x": "¿Qué cosa?"}, {"t": "d", "k": "P4", "v": false, "x": "Si todo esto lo hice para ayudar. (Señala sus cosas) Ayudé a la gente. Doné. Serví. Estuve cuando me necesitaron. ¿Por qué todo eso no cuenta? ¿Por qué tengo que tirarlo?"}, {"t": "a", "x": "(Silencio. El PASAJERO 2 vuelve a mirar su maleta; intenta esconder algo dentro de su chaqueta. El PASAJERO 3 lo ve."}, {"t": "d", "k": "P3", "v": false, "x": "¿Qué estás escondiendo? ¿Eso es un reloj?"}, {"t": "d", "k": "P2", "v": false, "x": "Sí."}, {"t": "d", "k": "P3", "v": false, "x": "¿Para qué quieres un reloj?"}, {"t": "d", "k": "P2", "v": false, "x": "Para saber la hora."}, {"t": "d", "k": "P3", "v": false, "x": "¿Y para qué?"}, {"t": "d", "k": "P2", "v": false, "x": "¡Porque quiero saber cuánto falta!"}, {"t": "a", "x": "Pausa."}, {"t": "d", "k": "P3", "v": false, "x": "¿Para qué?"}, {"t": "d", "k": "P2", "v": false, "x": "Para saber cuánto tengo que esperar…"}, {"t": "d", "k": "P3", "v": false, "x": "(PASAJERO 3 mira su propio reloj). Si lo necesitamos, yo tengo uno."}, {"t": "d", "k": "P2", "v": false, "x": "Bueno, pero ese es tuyo."}, {"t": "d", "k": "P3", "v": false, "x": "Sí. ¿Qué importa? ¿Solo quieres llevarlo porque te gusta, no porque lo necesites?"}, {"t": "d", "k": "P2", "v": false, "x": "Pues, también."}, {"t": "a", "x": "El PASAJERO 4 suspira."}, {"t": "d", "k": "P4", "v": false, "x": "Creo que todos deberíamos simplemente hacer lo que nos dijeron. Esto sí me lo voy a llevar, el resto no."}, {"t": "d", "k": "P1", "v": false, "x": "Pero dijo que no podemos llevar nada."}, {"t": "d", "k": "P4", "v": false, "x": "Ya sé. Pero esto … esto no quiero dejarlo."}, {"t": "d", "k": "P2", "v": false, "x": "¿Qué es?"}, {"t": "d", "k": "P4", "v": false, "x": "Nada. Algo mío. (guarda el objeto)"}, {"t": "d", "k": "P3", "v": false, "x": "¿Y usted?"}, {"t": "d", "k": "P1", "v": false, "x": "¿Qué?"}, {"t": "d", "k": "P3", "v": false, "x": "¿No se va a dejar nada?"}, {"t": "d", "k": "P1", "v": false, "x": "Esta no la voy a dejar. (saca la Biblia)"}, {"t": "d", "k": "P4", "v": false, "x": "Ahh, pero dijo TODO."}, {"t": "d", "k": "P1", "v": false, "x": "Sí, pero esto es diferente."}, {"t": "d", "k": "P3", "v": false, "x": "¿Por qué?"}, {"t": "d", "k": "P1", "v": false, "x": "Porque aquí está todo. Todo lo que necesitamos saber. Porque es la Biblia. Y bueno… ¿No se necesita esto como evidencia para poder viajar? ¿Siempre creí que era como una carta de recomendación, sabérsela, no?"}, {"t": "a", "x": "El PASAJERO 3 vuelve a mirar su teléfono."}, {"t": "d", "k": "P3", "v": false, "x": "No sé… ¿Alguien sabe cuánto tiempo tenemos? Porque yo tenía unas cosas pendientes, parte de mi maleta también."}, {"t": "d", "k": "P4", "v": false, "x": "¿Pendientes?"}, {"t": "d", "k": "P3", "v": false, "x": "¡Tengo que terminar unas cosas!"}, {"t": "d", "k": "P4", "v": false, "x": "¿Ahora? Amiga creo que ya no… (interrumpido)"}, {"t": "d", "k": "P3", "v": false, "x": "(Empieza a revisar su teléfono rápidamente.) Sí, ahora. ¡Mi esposa, trabajo, temas de la iglesia… uy! El campamento de los muchachos. Tengo cosas que dependen de mí. ¡Ya sabes! Me faltaron cosas por hacer."}, {"t": "d", "k": "P4", "v": false, "x": "¿Qué quiere decir eso? ¿Entonces no quieres viajar? ¿Por hacer cosas?"}, {"t": "d", "k": "P3", "v": false, "x": "No es que no quiera… (Mira el teléfono) Es que no pensé que sería tan pronto…"}, {"t": "a", "x": "El PASAJERO 3 lo mira. En ese momento, la AEROMOZA regresa. Todos se quedan quietos. Ella observa las maletas. Observa el basurero. Después los observa a ellos."}, {"t": "a", "x": "Silencio."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "¿Algún problema?"}, {"t": "d", "k": "P2", "v": false, "x": "No."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Eso está perfecto."}, {"t": "a", "x": "Nadie responde. La aeromoza mira al PASAJERO 2."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Usted."}, {"t": "d", "k": "P2", "v": false, "x": "¿Sí?"}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "¿No entendió la instrucción?"}, {"t": "d", "k": "P2", "v": false, "x": "Sí entendí."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "¿Entonces?"}, {"t": "d", "k": "P2", "v": false, "x": "Es que... tengo cosas importantes."}, {"t": "a", "x": "La aeromoza lo mira unos segundos."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Todas las tienen."}, {"t": "a", "x": "Silencio. La aeromoza continúa caminando. Ve la Biblia del PASAJERO 1.)"}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Eso también."}, {"t": "a", "x": "El PASAJERO 1 aprieta la Biblia contra su pecho."}, {"t": "d", "k": "P1", "v": false, "x": "Pero..."}, {"t": "a", "x": "La aeromoza levanta una ceja. El PASAJERO 1 no termina la frase. La aeromoza mira al PASAJERO 3."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Y usted deje el teléfono."}, {"t": "d", "k": "P3", "v": false, "x": "¿El teléfono?"}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Sí."}, {"t": "d", "k": "P3", "v": false, "x": "Pero tengo que hacer unas llamadas."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Claro… Adónde vamos, no hay servicio. Así que (señala la basura)"}, {"t": "a", "x": "Pausa. La aeromoza mira al PASAJERO 4."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Usted tampoco puede llevar eso."}, {"t": "d", "k": "P4", "v": false, "x": "Pero puede servirle a alguien."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "No en su destino. Silencio. Se dirige al basurero. (La aeromoza procede a salir de escena y se detiene justo cuando le preguntan)"}, {"t": "d", "k": "P4", "v": false, "x": "Entonces... ¿qué necesitamos para subir?"}, {"t": "a", "x": "Silencio. Todos miran a la AEROMOZA. Ella los mira."}, {"t": "a", "x": "Pausa."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Estar preparados."}, {"t": "d", "k": "P4", "v": false, "x": "¿Preparados para qué?"}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Para el viaje."}, {"t": "d", "k": "P4", "v": false, "x": "¿Y cómo sabemos si estamos preparados?"}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Eso es algo que cada uno tendrá que responder. Porque si van a abordar..."}, {"t": "a", "x": "Pausa."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Van a tener que decidir qué están dispuestos a dejar atrás."}, {"t": "a", "x": "La aeromoza se retira. Los cuatro pasajeros quedan mirando sus pertenencias. Esta vez, ya no hay tanta risa. (Se escucha de fondo “Pasajeros del Vuelo J/316…” Se apagan las luces"}, {"t": "f", "x": "FIN DE ESCENA 2"}]}, {"n": 3, "name": "¿Lo conoces?", "items": [{"t": "a", "x": "Se vuelve a encender la luz. Los cuatro siguen en la sala de espera. Ya no están exactamente igual. Cada uno está más pensativo. El ambiente sigue siendo de aeropuerto, pero la música navideña puede estar más bajita."}, {"t": "d", "k": "P2", "v": false, "x": "Bueno... tampoco es para tanto."}, {"t": "d", "k": "P3", "v": false, "x": "¿Qué cosa?"}, {"t": "d", "k": "P2", "v": false, "x": "El viaje. Las reglas. Las maletas... (mira alrededor) Eternidad. Digo que... si estamos aquí, por algo será. Lo que viene será mejor. ¿Hay que confiar?"}, {"t": "d", "k": "P1", "v": false, "x": "No hay que preocuparse..."}, {"t": "d", "k": "P2", "v": false, "x": "¡Exactamente, eso digo yo!"}, {"t": "d", "k": "P1", "v": false, "x": "Si estamos aquí, es porque hay una razón."}, {"t": "d", "k": "P4", "v": false, "x": "¿Pero y si no estamos preparados?"}, {"t": "d", "k": "P1", "v": false, "x": "Si que estamos preparados. Porque conocemos a Dios. (Pausa pequeña.)"}, {"t": "d", "k": "P3", "v": false, "x": "Claro…. (dudando y pensativo) Sí, sí… obvio…"}, {"t": "a", "x": "Una señora adulta mayor entra con una pequeña cartera y un bastón por detrás del público. Caminando lento y chocando y golpeando a todas las personas del lugar."}, {"t": "d", "k": "ABUELITA", "v": false, "x": "¡Buenos días, muchachitos! ¿Cómo están? (Mientras Saluda golpea con su bastón el borde de la silla, el costado de un pasajero, y cuando este se queja, gira fuertemente, golpeando la cabeza de otro. Terminada su entrada, se sienta en una de las sillas) Qué caritas… los veo golpeados…(pausa) por la vida. (Mientras todos se masajean los golpes que la viejita sin darse cuenta les dio)"}, {"t": "d", "k": "P2", "v": false, "x": "Sí, claro… por la vida. (Lo dice tan bajo que nadie lo escucha.)"}, {"t": "d", "k": "ABUELITA", "v": false, "x": "Disculpen... ¿Esta es la Puerta 1?"}, {"t": "d", "k": "TODOS", "v": false, "x": "Sí."}, {"t": "d", "k": "ABUELITA", "v": false, "x": "¿vuelo J/316?"}, {"t": "d", "k": "TODOS", "v": false, "x": "Sí."}, {"t": "d", "k": "ABUELITA", "v": false, "x": "¿Destino Eternidad?"}, {"t": "d", "k": "TODOS", "v": false, "x": "Sí."}, {"t": "d", "k": "ABUELITA", "v": false, "x": "Ah... perfecto. (Se sienta.) Los mira."}, {"t": "d", "k": "ABUELITA", "v": false, "x": "¿Ustedes ya conocen al que recibe a los pasajeros?"}, {"t": "a", "x": "Los cuatro se miran."}, {"t": "d", "k": "P1", "v": false, "x": "¿El qué recibe a los pasajeros? Ah, pues sí, claro que sí."}, {"t": "d", "k": "ABUELITA", "v": false, "x": "¿Lo conoce?"}, {"t": "d", "k": "P1", "v": false, "x": "Sí, correcto"}, {"t": "d", "k": "ABUELITA", "v": false, "x": "¿Personalmente?"}, {"t": "d", "k": "P1", "v": false, "x": "Bueno… he leído muchísimo acerca de Él. Conozco las Escrituras, sus enseñanzas… ¡Sé bastante de Él! ¿No le parece que eso significa que lo conozco?"}, {"t": "d", "k": "ABUELITA", "v": false, "x": "Ah... ¿Y usted? (se dirige al pasajero 2)"}, {"t": "d", "k": "P2", "v": false, "x": "¿Yo? Sí, sí…  también."}, {"t": "d", "k": "ABUELITA", "v": false, "x": "¿Lo conoce personalmente?"}, {"t": "d", "k": "P2", "v": false, "x": "Bueno... me ha ido bastante bien con él, la verdad."}, {"t": "d", "k": "ABUELITA", "v": false, "x": "¿Cómo?"}, {"t": "d", "k": "P2", "v": false, "x": "Pues... Dios ha sido bueno conmigo. Me consiente mucho (y empieza a mencionar: casa, trabajo, familia, bendiciones...) Nunca me ha faltado nada."}, {"t": "d", "k": "ABUELITA", "v": false, "x": "Qué bueno. Entonces lo conoce porque usted ha sido bendecido… ¿Y si algún día las cosas no le salen bien? ¿Lo reconocerías?"}, {"t": "d", "k": "P2", "v": false, "x": "Bueno… Sí, sí… Yo supongo que sí, hasta ahora pues todo ha estado bien."}, {"t": "d", "k": "ABUELITA", "v": false, "x": "Claro…  ¿Y usted?"}, {"t": "d", "k": "P3", "v": false, "x": "¿Yo?"}, {"t": "d", "k": "ABUELITA", "v": false, "x": "¿Lo conoce?"}, {"t": "d", "k": "P3", "v": false, "x": "Sí. Ufff íntimos! Trabajo mucho para él. ¡Muchísimos proyectos en común! En la iglesia y a nivel personal, claro. De hecho, dejé varios proyectos pendientes, pero bueno. Esto fue de fuerza mayor."}, {"t": "d", "k": "ABUELITA", "v": false, "x": "Ah, proyectos… ¿Y habla con él o solo trabaja para él?"}, {"t": "d", "k": "P3", "v": false, "x": "¿Cómo dice?"}, {"t": "d", "k": "ABUELITA", "v": false, "x": "¿Cuándo fue la última vez que hablaron… sin que usted estuviera trabajando para Él?"}, {"t": "d", "k": "P3", "v": false, "x": "Bueno..."}, {"t": "a", "x": "Pausa."}, {"t": "d", "k": "ABUELITA", "v": false, "x": "¿Y usted? ¿Lo conoce personalmente?"}, {"t": "d", "k": "P4", "v": false, "x": "Yo creo que mis obras hablan por mí. He ayudado a mucha gente. Siempre he tratado de hacer lo correcto. Así que… es evidente que tengo que conocerlo."}, {"t": "d", "k": "ABUELITA", "v": false, "x": "¿Y si no hay nadie a quien ayudar? ¿Si solo están ustedes dos? ¿Se sientan a conversar y pasar el rato?"}, {"t": "d", "k": "P4", "v": false, "x": "Pues…sí. ¿Solo nosotros dos?"}, {"t": "d", "k": "ABUELITA", "v": false, "x": "Qué curioso…."}, {"t": "d", "k": "P2", "v": false, "x": "¿Qué cosa?"}, {"t": "d", "k": "ABUELITA", "v": false, "x": "Todos lo conocen."}, {"t": "d", "k": "P1", "v": false, "x": "Pues sí. ¿Qué es lo curioso?"}, {"t": "d", "k": "ABUELITA", "v": false, "x": "Lo curioso es que todos me han contado lo que saben de Él, lo que han recibido de Él o lo que han hecho por Él. Pero todavía no me han contado cómo es estar con Él."}, {"t": "a", "x": "Silencio…"}, {"t": "d", "k": "P1", "v": false, "x": "¿Y usted? ¿Lo conoce?"}, {"t": "d", "k": "ABUELITA", "v": false, "x": "(La señora sonríe.) Sí… yo lo conozco. Y estoy ansiosa por verlo en persona."}, {"t": "d", "k": "P2", "v": false, "x": "¿Y cómo sabe que lo conoce, a ver?"}, {"t": "d", "k": "ABUELITA", "v": false, "x": "Porque con los años he aprendido que conocer a alguien no es solamente saber cosas de esa persona. Es compartir tiempo con ella, escucharla, confiarle lo que llevo por dentro… También disfruto de estar con Él, aun cuando no tengo nada que pedirle. ¡Las pláticas que hemos tenido él y yo. ¡Jajaja toda una vida!!"}, {"t": "d", "k": "P3", "v": false, "x": "¿Aunque no tenga nada que hacer o decir?"}, {"t": "d", "k": "ABUELITA", "v": false, "x": "Aunque no tenga nada que hacer o decir… (Pausa) Bueno... creo que ya es hora."}, {"t": "d", "k": "P4", "v": false, "x": "¿Hora de qué?"}, {"t": "d", "k": "ABUELITA", "v": false, "x": "De abordar."}, {"t": "a", "x": "La viejita se levanta y sale por el costado mientras todos la siguen con la mirada hasta que se marcha. La aeromoza aparece. Pero esta vez no viene a hablar con los cuatro. Va directamente hacia el regalo. Lo toma. La aeromoza lo mira, pero no lo abre."}, {"t": "d", "k": "P2", "v": false, "x": "¡Ya se fue! ¡Así no más! Disculpe (dirigiéndose hacia la aeromoza y señalando a la señora cuando cambia su mirada al regalo), ¿Eso qué es?"}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Un regalo."}, {"t": "d", "k": "P2", "v": false, "x": "¿Para quién?"}, {"t": "a", "x": "Ella mira el regalo."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Para todos."}, {"t": "f", "x": "FIN DE ESCENA 3"}]}, {"n": 4, "name": "El tiempo no espera", "items": [{"t": "a", "x": "La escena continúa inmediatamente después del final de la escena 3. La aeromoza sostiene el regalo y los cuatro pasajeros siguen observándolo. Hay una pausa."}, {"t": "d", "k": "P2", "v": false, "x": "¿Y no se puede saber qué es?"}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Es un regalo. No todo lo importante se descubre con solo mirarlo."}, {"t": "d", "k": "P1", "v": false, "x": "¿Y cuándo se abre?"}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Cuando alguien esté dispuesto a recibirlo."}, {"t": "a", "x": "La aeromoza coloca el regalo sobre la mesa. Se escucha un anuncio de aeropuerto."}, {"t": "d", "k": "AEROMOZA", "v": true, "x": "Atención, pasajeros. Les recordamos que el tiempo de espera no es ilimitado. Por favor, manténganse atentos a los llamados de abordaje."}, {"t": "d", "k": "P2", "v": false, "x": "Bueno, eso sí suena un poquito amenazante."}, {"t": "d", "k": "P3", "v": false, "x": "No necesariamente. En los aeropuertos los vuelos tienen horarios. Uno no puede llegar cuando le dé la gana."}, {"t": "d", "k": "P4", "v": false, "x": "Pero… ¿si alguno escucha de seguro lo van a buscar…"}, {"t": "d", "k": "P1", "v": false, "x": "Supongo que es probable."}, {"t": "a", "x": "En ese momento, entra un HOMBRE acompañado de su ESPOSA y sus DOS HIJOS. Vienen conversando y buscando la puerta."}, {"t": "d", "k": "HOMBRE", "v": false, "x": "¡Por aquí, por aquí! ¿Esta es la puerta?"}, {"t": "d", "k": "ESPOSA", "v": false, "x": "Sí, aquí dice Puerta 1, o sea que aquella es la Puerta 2."}, {"t": "d", "k": "HOMBRE", "v": false, "x": "¿Y este es el vuelo I/556 Destino eternidad?"}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Así es, caballero, sería en la puerta de al lado. Puerta 2. Su vuelo está por iniciar el embarque."}, {"t": "d", "k": "HOMBRE", "v": false, "x": "¡Perfecto! Llegamos bien. ¿Verdad que sí? (Mira a su familia.) Bueno, ¿qué sigue?"}, {"t": "d", "k": "ESPOSA", "v": false, "x": "Tenemos que estar atentos al llamado. Creo que ya podemos acercarnos."}, {"t": "d", "k": "HIJO", "v": false, "x": "¡Papi, vamos!"}, {"t": "d", "k": "HOMBRE", "v": false, "x": "Sí, mi amor, ya voy. Tranquilos, tenemos tiempo, esos vuelos siempre duran una eternidad para salir…"}, {"t": "a", "x": "El hombre revisa su celular. Suena una notificación."}, {"t": "d", "k": "HOMBRE", "v": false, "x": "¡Uy! Un mensaje del trabajo. Es un segundo, nada más. (A su esposa.) Adelántense, yo las alcanzo."}, {"t": "d", "k": "ESPOSA", "v": false, "x": "¿Seguro? ¿Vamos juntos? ¡Están abriendo ya el abordaje!"}, {"t": "d", "k": "HOMBRE", "v": false, "x": "Sí, sí. No me voy a perder el vuelo. Es un segundo. Vayan."}, {"t": "d", "k": "ESPOSA", "v": false, "x": "De acuerdo, te veo adentro. Voy a ir acomodando a los chicos."}, {"t": "a", "x": "La esposa y los niños se quedan un momento mirándolo. Luego avanzan hacia el lugar de abordaje."}, {"t": "d", "k": "HIJO", "v": false, "x": "¡Papi, ven!"}, {"t": "d", "k": "HOMBRE", "v": false, "x": "¡Ya voy, mi amor! ¡Ve con tu mamá!"}, {"t": "a", "x": "La familia sale por el costado del escenario. El hombre se queda respondiendo al mensaje."}, {"t": "d", "k": "P2", "v": false, "x": "Qué dicha que llegaron a tiempo."}, {"t": "d", "k": "P3", "v": false, "x": "Sí. Aunque él parece tener otras cosas en la cabeza, parece distraído."}, {"t": "d", "k": "P4", "v": false, "x": "A veces uno se distrae con tantas cosas que olvida para que vino."}, {"t": "d", "k": "P1", "v": false, "x": "Pero ya está por salir, debería guardar eso"}, {"t": "a", "x": "El hombre termina de escribir. Guarda el celular y mira alrededor."}, {"t": "d", "k": "HOMBRE", "v": false, "x": "Bueno, listo. ¿Ya llamaron a todos?"}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Todavía no."}, {"t": "d", "k": "HOMBRE", "v": false, "x": "¡Perfecto! Voy a aprovechar para comprar algo. No he comido nada."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Le recomiendo que permanezca atento."}, {"t": "d", "k": "HOMBRE", "v": false, "x": "Sí, sí. Es aquí a la vuelta. ¡No tardo nada!"}, {"t": "a", "x": "El hombre sale rápidamente. Los pasajeros lo observan."}, {"t": "d", "k": "P2", "v": false, "x": "¿Ustedes creen que sí le dé tiempo?"}, {"t": "d", "k": "P3", "v": false, "x": "Supongo que solo fue aquí a la vuelta."}, {"t": "d", "k": "P4", "v": false, "x": "¿No les parece curioso? ¿Encontró algo más urgente que hacer?"}, {"t": "d", "k": "P1", "v": false, "x": "No creo que lo haya hecho por falta de interés."}, {"t": "d", "k": "P3", "v": false, "x": "A veces no es que uno no quiera. Es que siempre aparece algo más que atender. El trabajo, los compromisos, la familia, los proyectos… y uno piensa: después voy a tener tiempo."}, {"t": "d", "k": "P2", "v": false, "x": "Bueno, sí, tampoco podemos dejar todo tirado. Hay cosas que son importantes."}, {"t": "d", "k": "P4", "v": false, "x": "Claro que sí. El problema no es tener responsabilidades. Es cuando todo tiene un espacio en nuestra vida, menos Dios."}, {"t": "a", "x": "Pausa."}, {"t": "d", "k": "P2", "v": false, "x": "Entonces… ¿qué hacemos con todo lo que tenemos que atender?"}, {"t": "d", "k": "P1", "v": false, "x": "No se trata de abandonar nuestras responsabilidades. Se trata de no dejar para después lo más importante."}, {"t": "a", "x": "Se escucha un anuncio."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Atención, pasajeros del vuelo I/556. Último llamado para abordar."}, {"t": "d", "k": "P3", "v": false, "x": "Woooo alto… ¿Dónde está el señor?"}, {"t": "d", "k": "P1", "v": false, "x": "No lo veo…"}, {"t": "d", "k": "P2", "v": false, "x": "¡Ahí está!"}, {"t": "a", "x": "El hombre entra apresurado, con algo en las manos."}, {"t": "d", "k": "HOMBRE", "v": false, "x": "¡Aquí estoy! ¡Aquí estoy! ¿Ya llamaron?"}, {"t": "a", "x": "Todos asienten con la cabeza y lo apresuran a tomar el vuelo."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Lo siento, señor. ¿Para dónde va?"}, {"t": "d", "k": "HOMBRE", "v": false, "x": "¡A mi vuelo, ya emitieron el último llamado! Puerta 2."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "¿Vuelo I/556? (El hombre asiente y se dirige a la puerta) Ya ha partido."}, {"t": "d", "k": "HOMBRE", "v": false, "x": "¿Cómo que ya partió? ¡Es una broma? Mi familia está en ese vuelo esperando. ¡Pero si solo fui un momento por…! ¡Yo estaba aquí! Mi familia ya había pasado… ¡Yo les dije que ya iba!"}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Entiendo, pero se hicieron los llamados correspondientes."}, {"t": "d", "k": "HOMBRE", "v": false, "x": "¡Sí, pero…! ¡No puedo perder el vuelo! ¡No hay otro! ¡Yo estaba aquí! ¡Yo pensé que tenía tiempo! Fue solo un minuto, me distraje… No me puede hacer esto, señorita, por favor, mi esposa y mis hijos van en ese vuelo. Necesito comprar otro boleto…"}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Lo siento… Es un boleto y un vuelo nada más. Y ya se marchó. Con permiso."}, {"t": "d", "k": "HOMBRE", "v": false, "x": "¡No, no, no puede ser! Voy a entrar, Empuja hacia la puerta 2."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "¡Puede pasar… Pero no hay un avión ahí, señor. Ya se marchó."}, {"t": "a", "x": "El hombre se inclina y cae en el suelo viendo por donde su familia se marchó."}, {"t": "d", "k": "P2", "v": false, "x": "Qué duro… lo dejó el vuelo. Bueno... creo que después de todo lo que ha pasado, ya no tengo tantas ganas de quejarme por la espera."}, {"t": "d", "k": "P3", "v": false, "x": "Él pensó que podía hacerlo después. Es curioso... he pasado tanto tiempo corriendo de un lado para otro, haciendo mil cosas, que ni siquiera me había detenido a pensar en qué estaba esperando realmente"}, {"t": "d", "k": "P4", "v": false, "x": "Y el después no llegó. Yo pensaba que con todo lo que había hecho, con todo lo que había ayudado... ya estaba más que preparado."}, {"t": "d", "k": "P1", "v": false, "x": "¿Y si nosotros estamos haciendo lo mismo? Y yo... yo conozco todos los procedimientos, las instrucciones, las reglas del viaje. Pero creo que nunca me detuve a preguntarme si realmente conocía al que nos invitó a viajar. Por eso la Palabra dice: “Buscad a Jehová mientras puede ser hallado, llamadle en tanto que está cercano”."}, {"t": "d", "k": "P2", "v": false, "x": "¿Y eso dónde está?"}, {"t": "d", "k": "P1", "v": false, "x": "Isaías 55:6."}, {"t": "d", "k": "P4", "v": false, "x": "Tal vez confundí hacer cosas para Dios con tener una relación con Él."}, {"t": "d", "k": "P2", "v": false, "x": "Entonces, ¿de qué sirve llegar al final habiendo hecho tantas cosas, si nunca nos detuvimos a conocerlo?"}, {"t": "a", "x": "Silencio."}, {"t": "a", "x": "La aeromoza se acerca a la mesa y toma nuevamente el regalo. Los pasajeros lo miran."}, {"t": "d", "k": "P2", "v": false, "x": "¿Y ese regalo? ¿Todavía está ahí?"}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Claro. Sigue siendo para todos."}, {"t": "d", "k": "P1", "v": false, "x": "¿Cuándo dices para todos también hablas de nosotros, nos trajeron ese regalo… ¿Y todavía podemos recibirlo?"}, {"t": "a", "x": "La aeromoza mira a los pasajeros y luego el regalo."}, {"t": "d", "k": "AEROMOZA", "v": false, "x": "Mientras estén aquí, todavía pueden responder."}, {"t": "a", "x": "La aeromoza sostiene el regalo. Los pasajeros quedan observándolo. El hombre permanece sentado, en silencio."}, {"t": "f", "x": "FIN DE ESCENA 4"}]}, {"n": 5, "name": "El regalo y la verdadera conexión", "items": [{"t": "d", "k": "AEROMOZA", "v": false, "x": "Bueno! Creo que ya es hora de que alguien abra este regalo."}, {"t": "d", "k": "P2", "v": false, "x": "¡Por fin! Yo desde hace rato tengo curiosidad. ¿Qué es? ¿Dinero? ¿Un viaje? ¿Un bono para primera clase?"}, {"t": "d", "k": "MENSAJERO", "v": false, "x": "¡Tranquilo! No todo en la vida se trata de lo que uno puede conseguir."}, {"t": "d", "k": "P4", "v": false, "x": "Pero dice PARA TODOS. ¿Eso significa que todos tenemos derecho a recibirlo?"}, {"t": "d", "k": "MENSAJERO", "v": false, "x": "Exactamente. Es un regalo para todos."}, {"t": "a", "x": "(El Mensajero toma el regalo y lo coloca en un lugar visible. Lo abre cuidadosamente. Dentro encuentra una Biblia o una tarjeta grande con el mensaje: «JESÚS. JUAN 3:16».)"}, {"t": "d", "k": "P1", "v": false, "x": "¿Juan 3:16?"}, {"t": "d", "k": "MENSAJERO", "v": false, "x": "Sí. Seguramente lo has escuchado muchas veces."}, {"t": "d", "k": "P1", "v": false, "x": "¡Por supuesto! De hecho, me lo sé de memoria."}, {"t": "d", "k": "P3", "v": false, "x": "¿Y qué tiene que ver ese versículo con el regalo?"}, {"t": "d", "k": "MENSAJERO", "v": false, "x": "Que ese es precisamente el regalo. Dios nos amó tanto que nos dio a su Hijo. Jesús vino al mundo para que pudiéramos tener vida por medio de Él."}, {"t": "d", "k": "P4", "v": false, "x": "¿Y eso es para todos?"}, {"t": "d", "k": "MENSAJERO", "v": false, "x": "Para todos. No es algo que uno se gana por portarse bien, por cumplir reglas, por estar ocupado haciendo cosas buenas o por tener una vida llena de bendiciones. Es un regalo que se recibe."}, {"t": "d", "k": "P2", "v": false, "x": "O sea... ¿que no se trata de cuánto tengo?"}, {"t": "d", "k": "MENSAJERO", "v": false, "x": "No."}, {"t": "d", "k": "P3", "v": false, "x": "¿Ni de cuánto hago?"}, {"t": "d", "k": "MENSAJERO", "v": false, "x": "Tampoco."}, {"t": "d", "k": "P1", "v": false, "x": "¿Ni siquiera de cuánto sé?"}, {"t": "d", "k": "MENSAJERO", "v": false, "x": "Conocer la Palabra es importante. Pero Dios no quiere ser solamente alguien de quien has escuchado hablar. Quiere que lo conozcas personalmente."}, {"t": "a", "x": "(Pausa. Los pasajeros observan el regalo.)"}, {"t": "d", "k": "MENSAJERO", "v": false, "x": "¿Saben algo? A veces podemos pasar tanto tiempo preparándonos para un viaje, preocupándonos por el equipaje, los documentos, los horarios y los boletos... que olvidamos lo más importante: conocer a quien nos está invitando."}, {"t": "a", "x": "(Entra el Capitán acompañado del Maletero. El Maletero lleva algún objeto o maleta que pueda servir para una pequeña interacción cómica.)"}, {"t": "d", "k": "CAPITAN", "v": false, "x": "¡Atención, pasajeros! ¿Cómo va todo por aquí? ¿Ya estamos listos para continuar?"}, {"t": "d", "k": "MALETERO", "v": false, "x": "Capitán, yo creo que algunos todavía están revisando si les falta algo. ¡Llevan tanto rato esperando que ya hasta me aprendí sus conversaciones!"}, {"t": "d", "k": "CAPITAN", "v": false, "x": "Bueno, es que hay personas que se toman muy en serio los preparativos del viaje... aunque a veces se les olvida para qué están viajando."}, {"t": "d", "k": "MALETERO", "v": false, "x": "¡Exactamente! Yo he visto de todo. Gente que llega con tres maletas, dos bolsos, una almohada, comida para el camino... ¡y hasta con una planta!"}, {"t": "d", "k": "CAPITAN", "v": false, "x": "¿Una planta?"}, {"t": "d", "k": "MALETERO", "v": false, "x": "¡Sí! Dice que no puede viajar sin ella. ¡Imagínese! Si seguimos así, vamos a tener que habilitar una sección de jardín en el avión."}, {"t": "a", "x": "(Pequeña pausa para la reacción.)"}, {"t": "d", "k": "CAPITAN", "v": false, "x": "Pero hablando en serio... hay algo que siempre me ha llamado la atención de esta sala de espera. Hay personas que llevan muchísimo tiempo aquí. Algunas conocen perfectamente el destino, otras conocen todos los procedimientos y algunas hasta podrían dar instrucciones a los demás."}, {"t": "d", "k": "MALETERO", "v": false, "x": "¡Pero una cosa es conocer el aeropuerto y otra muy diferente conocer al que te invitó al viaje!"}, {"t": "d", "k": "CAPITAN", "v": false, "x": "Así es. Y mientras esperamos, vale la pena preguntarnos algo: ¿estamos realmente preparados? ¿Conocemos verdaderamente a Dios?"}, {"t": "a", "x": "(El ambiente se vuelve más reflexivo.)"}, {"t": "d", "k": "MALETERO", "v": false, "x": "Porque uno puede estar aquí, sentado en la puerta correcta, con el boleto en la mano... y aun así no haber entendido lo más importante."}, {"t": "d", "k": "CAPITAN", "v": false, "x": "Y no se trata de vivir con miedo, ni de pensar que tenemos que ganarnos una invitación. Dios ya nos mostró su amor. Nos dio a Jesús."}, {"t": "d", "k": "MENSAJERO", "v": false, "x": "Ese es el regalo. El regalo de Navidad. Jesús no vino solamente para que recordáramos su nacimiento una vez al año. Vino para acercarnos a Dios, para que pudiéramos conocerlo y tener una relación con Él."}, {"t": "d", "k": "P3", "v": false, "x": "Entonces todavía puedo empezar a conocerlo de verdad... no solamente seguir haciendo cosas."}, {"t": "d", "k": "P4", "v": false, "x": "Y dejar de pensar que tengo que ganarme su amor."}, {"t": "d", "k": "P2", "v": false, "x": "Tal vez he estado tan ocupado disfrutando todo lo que tengo, que olvidé quién me lo ha dado."}, {"t": "d", "k": "P1", "v": false, "x": "Y yo he pasado tanto tiempo hablando de Dios, que necesito detenerme a escucharlo y conocerlo de verdad."}, {"t": "a", "x": "(El Capitán observa a los pasajeros.)"}, {"t": "d", "k": "CAPITAN", "v": false, "x": "Entonces, pasajeros, recuerden: el propósito de este viaje no es simplemente llegar a un destino. Es responder a la invitación de conocer a quien nos ama y nos llama a tener una relación con Él."}, {"t": "d", "k": "MALETERO", "v": false, "x": "Y mientras seguimos en esta sala de espera, todavía tenemos algo muy importante que hacer."}, {"t": "d", "k": "P2", "v": false, "x": "¿Comprar algo para el camino?"}, {"t": "d", "k": "MALETERO", "v": false, "x": "¡No! ¡Dejar de distraernos y empezar a conocerlo!"}, {"t": "a", "x": "(Una pequeña sonrisa. Luego, el ambiente vuelve a ser reflexivo.)"}, {"t": "d", "k": "MENSAJERO", "v": false, "x": "Porque todavía estamos aquí. Todavía podemos acercarnos a Él. Todavía podemos buscarlo, escucharlo y comenzar una relación verdadera con Dios."}, {"t": "d", "k": "CAPITAN", "v": false, "x": "La invitación sigue siendo la misma. Y el regalo sigue siendo para todos."}, {"t": "a", "x": "(Todos observan el regalo. Se puede proyectar o colocar en un lugar visible la frase «PORQUE DE TAL MANERA AMÓ DIOS AL MUNDO...».)"}, {"t": "d", "k": "MENSAJERO", "v": false, "x": "No importa cuánto tiempo hayas pasado distraído. No importa si has estado confiando en tus propias fuerzas, en tus obras o en lo que sabes. Hoy puedes comenzar algo diferente."}, {"t": "d", "k": "MALETERO", "v": false, "x": "Porque todavía estás aquí."}, {"t": "d", "k": "CAPITAN", "v": false, "x": "Y todavía tienes tiempo para conocerlo."}, {"t": "a", "x": "(Los personajes permanecen en escena. La iluminación y la música acompañan el momento final.)"}, {"t": "d", "k": "MENSAJERO", "v": false, "x": "El regalo ya fue dado. La pregunta es: ¿qué vas a hacer con Él?"}, {"t": "a", "x": "(Pausa.)"}, {"t": "f", "x": "FIN DE LA OBRA"}]}]};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fm=s=>esc(s).replace(/(\([^)]*\))/g,'<span class="ac">$1</span>');
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const out=document.getElementById('out');
let h='';
D.scenes.forEach(s=>{h+=`<div class="banner" id="e${s.n}"><b>ESCENA ${s.n}</b>${esc(s.name)}<small class="cnt" data-s="${s.n}"></small></div>`;
 s.items.forEach(i=>{
  if(i.t==='a')h+=`<div class="dir">${esc(i.x)}</div>`;
  else if(i.t==='f')h+=`<div class="fin">· · · ${i.x} · · ·</div>`;
  else{const c=D.chars[i.v?'VOZ':i.k];const tk=/^EQUIPAJE:/i.test(i.x);
   h+=`<div class="row" data-k="${i.k}" data-s="${s.n}"><div class="c1"><span class="tag" style="background:${c.bg};color:${c.fg}">${c.e} ${c.n}</span></div><div class="tx">${tk?'🎫 BOLETO · '+esc(i.x):fm(i.x)}</div></div>`}
 })});
out.innerHTML=h;
const chips=document.getElementById('chips');let sel=null;
D.order.forEach(k=>{const c=D.chars[k];const b=document.createElement('button');b.className='chip';b.dataset.k=k;
 b.style.background=c.bg;b.style.color=c.fg;b.innerHTML=`${c.e} ${c.n}${c.a?'<small>'+c.a+'</small>':''}`;b.onclick=()=>pick(sel===k?null:k);chips.appendChild(b)});
const bar=document.getElementById('bar'),scs=document.getElementById('sc');
scs.innerHTML='<option value="">Ir a escena…</option>'+D.scenes.map(s=>`<option value="e${s.n}">Escena ${s.n} · ${esc(s.name)}</option>`).join('');
scs.onchange=()=>{if(scs.value){document.getElementById(scs.value).scrollIntoView({behavior:'smooth'});scs.value=''}};
let mine=[];
function pick(k){sel=k;store.set('pde_char',k||'');
 document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 document.body.classList.toggle('pick',!!k);bar.classList.toggle('show',!!k);
 document.querySelectorAll('.row').forEach(r=>{r.classList.remove('mine','other');r.querySelectorAll('.n').forEach(n=>n.remove());
  if(k)r.classList.add(r.dataset.k===k?'mine':'other')});
 document.querySelectorAll('.cnt').forEach(c=>c.textContent='');
 const tot=document.getElementById('tot');
 if(!k){tot.style.display='none';mine=[];return}
 mine=[...document.querySelectorAll('.row.mine')];
 mine.forEach((r,i)=>{const n=document.createElement('span');n.className='n';n.textContent=`LÍNEA ${i+1} DE ${mine.length}`;r.querySelector('.tx').prepend(n)});
 const per={};mine.forEach(r=>per[r.dataset.s]=(per[r.dataset.s]||0)+1);
 document.querySelectorAll('.cnt').forEach(c=>{const n=per[c.dataset.s]||0;c.textContent=n?`Tus líneas en esta escena: ${n}`:'No tienes líneas en esta escena'});
 const c=D.chars[k];const coro=document.querySelectorAll('.row[data-k="TODOS"]').length;
 document.getElementById('who').innerHTML=`<b>${c.e} ${c.n}</b> · ${mine.length} líneas`;
 tot.style.display='block';
 tot.innerHTML=`<b>${c.e} ${c.n}${c.a?' ('+esc(c.a)+')':''}</b>: ${mine.length} líneas en toda la obra · `+D.scenes.map(s=>`Esc. ${s.n}: ${per[s.n]||0}`).join(' · ')+(coro?` · (aparte hay ${coro} líneas "TODOS" en coro)`:'');
 setTimeout(()=>document.documentElement.style.setProperty('--barh',bar.offsetHeight+'px'),0)}
const lim=()=>bar.offsetHeight+16;
document.getElementById('nx').onclick=()=>{const r=mine.find(r=>r.getBoundingClientRect().top>lim()+4);if(r)r.scrollIntoView({behavior:'smooth'})};
document.getElementById('pv').onclick=()=>{const p=mine.filter(r=>r.getBoundingClientRect().top<lim()-4);const r=p[p.length-1];if(r)r.scrollIntoView({behavior:'smooth'})};
let fs=parseInt(store.get('pde_fs'))||19;const setfs=v=>{fs=Math.max(14,Math.min(30,v));document.documentElement.style.setProperty('--fs',fs+'px');store.set('pde_fs',fs)};setfs(fs);
document.getElementById('fm').onclick=e=>{e.preventDefault();setfs(fs-2)};document.getElementById('fp').onclick=e=>{e.preventDefault();setfs(fs+2)};
const sv=store.get('pde_char');if(sv&&D.chars[sv])pick(sv);
</script></body></html>
